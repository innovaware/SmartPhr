<div class="container-fluid p-4">
    <!-- Titolo della Pagina -->
    <div class="row mb-3">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h1 class="page-title mb-0">FATTURE SERVIZIO SOCIALE</h1>
            <button mat-flat-button class="btn-primary-custom" (click)="addFattura()" *ngIf="!addingFattura">
                <mat-icon class="me-1">add</mat-icon>
                Aggiungi Fattura
            </button>
        </div>
    </div>

    <hr class="divider-custom mb-4" />

    <!-- Form di Inserimento/Upload Fattura -->
    <div class="row mb-3" *ngIf="addingFattura">
        <div class="col-12">
            <div class="card p-3 mb-3 border-0 shadow-sm">
                <div class="row align-items-center mb-2" *ngIf="!uploadingFattura">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <input type="file" class="form-control" (change)="uploadFattura($event)" accept=".pdf">
                    </div>
                    <div class="col-md-6 text-end">
                        <button mat-button color="warn" (click)="addingFattura = false">Annulla</button>
                    </div>
                </div>

                <div class="row align-items-center">
                    <div class="col-md-9">
                        <mat-form-field class="full-width" appearance="outline">
                            <mat-label>Note</mat-label>
                            <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovaFattura.note">
                        </mat-form-field>
                    </div>
                    <div class="col-md-3 text-end">
                        <button mat-flat-button class="btn-primary-custom" (click)="saveFattura(nuovaFattura)" [disabled]="uploadingFattura">
                            Salva
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Indicator In Caricamento -->
    <div class="row mb-3" *ngIf="uploadingFattura">
        <div class="col-12 d-flex align-items-center gap-2">
            <mat-spinner [diameter]="24"></mat-spinner>
            <span>Caricamento in corso...</span>
        </div>
    </div>

    <!-- Campo Filtro / Cerca -->
    <div class="row mb-3">
        <div class="col-12">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Cerca</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Cerca qui..." #input>
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
    </div>

    <!-- Contenitore Tabella -->
    <div class="row">
        <div class="col-12">
            <div class="table-card-container mb-3">
                <table mat-table [dataSource]="dataSource">

                    <!-- Documento Column -->
                    <ng-container matColumnDef="filename">
                        <th mat-header-cell *matHeaderCellDef> Documento </th>
                        <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
                    </ng-container>

                    <!-- Data Inserimento Column -->
                    <ng-container matColumnDef="dataUpload">
                        <th mat-header-cell *matHeaderCellDef> Data Inserimento </th>
                        <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
                    </ng-container>

                    <!-- Note Column -->
                    <ng-container matColumnDef="note">
                        <th mat-header-cell *matHeaderCellDef> Note </th>
                        <td mat-cell *matCellDef="let element"> {{element.note}} </td>
                    </ng-container>

                    <!-- Azioni Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef class="text-end"> Azioni </th>
                        <td mat-cell *matCellDef="let row" class="text-end">
                            <div class="action-buttons-wrapper">
                                <button mat-icon-button class="btn-action-view" (click)="show(row)" title="Visualizza PDF">
                                    <mat-icon class="text-danger">picture_as_pdf</mat-icon>
                                </button>
                                <button mat-icon-button class="btn-action-delete" (click)="deleteFattura(row)" title="Elimina">
                                    <mat-icon class="text-secondary">delete</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <!-- State Vuoto -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                            <div class="empty-state">
                                <mat-icon>description</mat-icon>
                                <span>Nessuna fattura presente</span>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Paginator -->
            <div>
                <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Seleziona pagina"></mat-paginator>
            </div>
        </div>
    </div>
</div>
