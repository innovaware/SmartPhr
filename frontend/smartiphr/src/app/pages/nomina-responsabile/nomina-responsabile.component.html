<div class="main-card-container">
    <!-- Header del Componente -->
    <div class="component-header mb-4">
        <h1 class="component-title">AREA QUALITÀ - Nomina Responsabile</h1>
    </div>

    <!-- Toolbar Filtro e Inserimento -->
    <div class="toolbar-container mb-3">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Cerca</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Cerca qui..." [(ngModel)]="inputSearchField">
            <button mat-icon-button matSuffix *ngIf="inputSearchField" (click)="cleanSearchField()" aria-label="Pulisci">
                <mat-icon>close</mat-icon>
            </button>
            <mat-icon matSuffix *ngIf="!inputSearchField">search</mat-icon>
        </mat-form-field>

        <button mat-raised-button class="btn-primary" *ngIf="admin && !addingNominaResponsabile" (click)="addNominaResponsabile()">
            <mat-icon>add</mat-icon>
            <span>Aggiungi Documento</span>
        </button>
    </div>

    <!-- Panel Form Inserimento Nuovo Documento -->
    <div class="form-card mb-4" *ngIf="admin && addingNominaResponsabile && !uploadingNominaResponsabile">
        <div class="form-row mb-3">
            <div class="file-input-container">
                <label class="form-label">Seleziona File PDF</label>
                <input type="file" (change)="uploadNominaResponsabile($event)" accept=".pdf" class="file-input">
            </div>
        </div>

        <div class="form-row">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Note</mat-label>
                <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovoNominaResponsabile.note">
            </mat-form-field>

            <button mat-raised-button class="btn-primary align-self-center" (click)="saveNominaResponsabile(nuovoNominaResponsabile)">
                <mat-icon>save</mat-icon>
                <span>Salva</span>
            </button>
        </div>
    </div>

    <!-- Indicatore di Caricamento -->
    <div class="loading-container mb-3" *ngIf="admin && uploadingNominaResponsabile">
        <mat-spinner [diameter]="24"></mat-spinner>
        <span>Caricamento in corso...</span>
    </div>

    <!-- Stato Vuoto -->
    <div class="empty-state" *ngIf="this.NominaResponsabile?.length <= 0">
        <mat-icon>description</mat-icon>
        <p>Nessun documento presente</p>
    </div>

    <!-- Tabella Nomina Responsabile -->
    <div class="table-card-container" *ngIf="this.NominaResponsabile?.length > 0">
        <table mat-table [dataSource]="NominaResponsabileDataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row" style="text-align: right;">
                    <button mat-icon-button color="primary" (click)="showDocument(row)" matTooltip="Visualizza PDF">
                        <mat-icon>picture_as_pdf</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" *ngIf="admin" (click)="deleteNominaResponsabile(row)" matTooltip="Elimina">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <ng-container matColumnDef="namefile">
                <th mat-header-cell *matHeaderCellDef> Nome file </th>
                <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
            </ng-container>

            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> Data Inserimento </th>
                <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
            </ng-container>

            <ng-container matColumnDef="note">
                <th mat-header-cell *matHeaderCellDef> Note </th>
                <td mat-cell *matCellDef="let element"> {{element.note}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: DisplayedColumns;"></tr>
        </table>
    </div>

    <!-- Paginatore lasciato integro esattamente come in origine -->
    <div class="paginator-container">
        <mat-paginator #paginatorNominaResponsabile [pageSizeOptions]="[5,10,20]" showFirstLastButtons
                       aria-label="Select page of periodic elements">
        </mat-paginator>
    </div>
</div>
