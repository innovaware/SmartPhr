<div class="container pad">
    <div class="row align-items-center mb-3">
        <div class="col">
            <h1 class="title m-0">Lavoro</h1>
        </div>
    </div>

    <hr class="mb-4">

    <mat-tab-group mat-align-tabs="start">

        <!-- CONTRATTI LAVORO -->
        <mat-tab label="Contratti di lavoro">
            <div class="py-3">

                <!-- Pulsante Aggiungi Documento -->
                <div class="mb-3" *ngIf="!addingContratto">
                    <button mat-raised-button color="primary" (click)="addContratto()">
                        <mat-icon>add</mat-icon>
                        <span class="ms-1">Aggiungi Documento</span>
                    </button>
                </div>

                <!-- Form Inserimento Contratto -->
                <mat-card class="mb-4 p-3 mat-elevation-z2" *ngIf="addingContratto && !uploadingContratto">
                    <mat-card-header class="mb-2">
                        <mat-card-title style="font-size: 1.1rem; color: #1976d2;">Nuovo Contratto di Lavoro</mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Seleziona File (PDF)</label>
                                <input class="form-control" type="file" (change)="uploadContratto($event)" accept=".pdf" *ngIf="!uploadingContratto">
                                <label *ngIf="uploadingContratto" class="text-muted">Caricamento in corso ...</label>
                            </div>

                            <div class="col-md-9">
                                <mat-form-field appearance="outline" class="w-100">
                                    <mat-label>Note</mat-label>
                                    <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovoContratto.note">
                                    <mat-icon matSuffix>note</mat-icon>
                                </mat-form-field>
                            </div>

                            <div class="col-md-3 d-flex align-items-center justify-content-end gap-2">
                                <button mat-raised-button color="primary" (click)="saveContratto(nuovoContratto)" title="Salva">
                                    <mat-icon>save</mat-icon>
                                    <span class="ms-1">Salva</span>
                                </button>
                                <button mat-button (click)="addingContratto = false" title="Annulla">
                                    <mat-icon>close</mat-icon>
                                    <span class="ms-1">Annulla</span>
                                </button>
                            </div>
                        </div>
                    </mat-card-content>
                </mat-card>

                <!-- Spinner Caricamento -->
                <div class="my-4" *ngIf="uploadingContratto">
                    <div class="d-flex align-items-center gap-3">
                        <mat-spinner [diameter]="28"></mat-spinner>
                        <span class="text-muted">Caricamento in corso ...</span>
                    </div>
                </div>

                <!-- Avviso Nessun Documento -->
                <div *ngIf="!contratti || contratti.length === 0" class="alert alert-info text-center my-3" role="alert">
                    <mat-icon class="align-middle me-1">info</mat-icon>
                    Nessun documento presente in archivio.
                </div>

                <!-- Tabella Contratti -->
                <div class="table-responsive mat-elevation-z8 rounded-2 overflow-hidden mb-3" *ngIf="contratti && contratti.length > 0">
                    <table mat-table [dataSource]="contrattiDataSource" style="width: 100%;">

                        <!-- Nome File -->
                        <ng-container matColumnDef="namefile">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Nome File </th>
                            <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
                        </ng-container>

                        <!-- Data Inserimento -->
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Data Inserimento </th>
                            <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
                        </ng-container>

                        <!-- Note -->
                        <ng-container matColumnDef="note">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Note </th>
                            <td mat-cell *matCellDef="let element"> {{element.note || '-'}} </td>
                        </ng-container>

                        <!-- Azioni -->
                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef class="text-end fw-bold text-uppercase"> Azioni </th>
                            <td mat-cell *matCellDef="let row" class="text-end">
                                <button mat-icon-button color="primary" (click)="showDocument(row)" title="Visualizza PDF">
                                    <mat-icon color="warn">picture_as_pdf</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" (click)="deleteContratto(row)" title="Elimina Documento">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: DisplayedColumns;" class="table-row-hover"></tr>
                    </table>

                    <!-- Paginatore -->
                    <mat-paginator #paginatorContratto [pageSizeOptions]="[5, 10, 20]"  aria-label="Seleziona pagina">
                    </mat-paginator>
                </div>

            </div>
        </mat-tab>
