<div class="container-fluid p-4">
    <!-- Titolo della Pagina -->
    <div class="row align-items-center mb-3">
        <div class="col">
            <h1 class="page-title mb-0">Lavoro</h1>
        </div>
    </div>

    <hr class="divider-custom mb-4">

    <mat-tab-group mat-align-tabs="start">

        <!-- CONTRATTI LAVORO -->
        <mat-tab label="Contratti di lavoro">
            <div class="py-3">

                <!-- Pulsante Aggiungi Documento -->
                <div class="mb-3" *ngIf="!addingContratto">
                    <button mat-flat-button class="btn-primary-custom" (click)="addContratto()">
                        <mat-icon class="me-1">add</mat-icon>
                        <span>Aggiungi Documento</span>
                    </button>
                </div>

                <!-- Form Inserimento Contratto -->
                <mat-card class="mb-4 p-3 mat-elevation-z2" *ngIf="addingContratto && !uploadingContratto">
                    <mat-card-header class="mb-2 p-0">
                        <mat-card-title class="card-title-custom">Nuovo Contratto di Lavoro</mat-card-title>
                    </mat-card-header>
                    <mat-card-content class="p-0">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Seleziona File (PDF)</label>
                                <input class="form-control" type="file" (change)="uploadContratto($event)" accept=".pdf" *ngIf="!uploadingContratto">
                                <label *ngIf="uploadingContratto" class="text-muted">Caricamento in corso ...</label>
                            </div>

                            <div class="col-md-9">
                                <mat-form-field appearance="outline" class="w-100">
                                    <mat-label>Note</mat-label>
                                    <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovoContratto.note">
                                    <mat-icon matSuffix>note</mat-icon>
                                </mat-form-field>
                            </div>

                            <div class="col-md-3 d-flex align-items-center justify-content-end gap-2">
                                <button mat-flat-button class="btn-primary-custom" (click)="saveContratto(nuovoContratto)" title="Salva">
                                    <mat-icon class="me-1">save</mat-icon>
                                    <span>Salva</span>
                                </button>
                                <button mat-button (click)="addingContratto = false" title="Annulla">
                                    <mat-icon class="me-1">close</mat-icon>
                                    <span>Annulla</span>
                                </button>
                            </div>
                        </div>
                    </mat-card-content>
                </mat-card>

                <!-- Spinner Caricamento -->
                <div class="my-4" *ngIf="uploadingContratto">
                    <div class="d-flex align-items-center gap-3">
                        <mat-spinner [diameter]="28"></mat-spinner>
                        <span class="text-muted">Caricamento in corso ...</span>
                    </div>
                </div>

                <!-- Contenitore Tabella -->
                <div class="table-card-container mb-3">
                    <table mat-table [dataSource]="contrattiDataSource" style="width: 100%;">

                        <!-- Nome File -->
                        <ng-container matColumnDef="namefile">
                            <th mat-header-cell *matHeaderCellDef> Nome File </th>
                            <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
                        </ng-container>

                        <!-- Data Inserimento -->
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef> Data Inserimento </th>
                            <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
                        </ng-container>

                        <!-- Note -->
                        <ng-container matColumnDef="note">
                            <th mat-header-cell *matHeaderCellDef> Note </th>
                            <td mat-cell *matCellDef="let element"> {{element.note || '-'}} </td>
                        </ng-container>

                        <!-- Azioni -->
                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef class="text-end"> Azioni </th>
                            <td mat-cell *matCellDef="let row" class="text-end">
                                <button mat-icon-button color="primary" (click)="showDocument(row)" title="Visualizza PDF">
                                    <mat-icon>picture_as_pdf</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" (click)="deleteContratto(row)" title="Elimina Documento">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: DisplayedColumns;"></tr>

                        <!-- State Vuoto NATIVO della mat-table -->
                        <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell" [attr.colspan]="DisplayedColumns.length">
                                <div class="empty-state">
                                    <mat-icon>description</mat-icon>
                                    <span>Nessun documento presente in archivio.</span>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <!-- REGOLA TASSATIVA: Paginator posizionato SEMPRE nello stesso punto del DOM originale e NON avvolto da *ngIf -->
                <div>
                    <mat-paginator #paginatorContratto [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Seleziona pagina">
                    </mat-paginator>
                </div>

            </div>
        </mat-tab>

    </mat-tab-group>
</div>
