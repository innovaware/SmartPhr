<div class="main-card-container">
    <!-- Header del Componente -->
    <div class="component-header mb-4">
        <h1 class="component-title">AREA QUALITÀ - Nomina DPO (Responsabile Protezione dei Dati Personali)</h1>
    </div>

    <!-- Toolbar Filtro e Inserimento -->
    <div class="toolbar-container mb-3">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Cerca</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Cerca qui..." [(ngModel)]="inputSearchField">
            <button mat-icon-button matSuffix *ngIf="inputSearchField" (click)="cleanSearchField()" aria-label="Pulisci">
                <mat-icon>close</mat-icon>
            </button>
            <mat-icon matSuffix *ngIf="!inputSearchField">search</mat-icon>
        </mat-form-field>

        <button mat-flat-button class="btn-primary-custom" *ngIf="admin && !addingNominaDPO" (click)="addNominaDPO()">
            <mat-icon>add</mat-icon>
            <span>Aggiungi Documento</span>
        </button>
    </div>

    <!-- Panel Form Inserimento Nuovo DPO -->
    <div class="form-card mb-4" *ngIf="admin && addingNominaDPO && !uploadingNominaDPO">
        <div class="form-row mb-3">
            <div class="file-input-container">
                <label class="form-label">Seleziona File PDF</label>
                <input type="file" (change)="uploadNominaDPO($event)" accept=".pdf" class="file-input">
            </div>
        </div>

        <div class="form-row">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Note</mat-label>
                <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovoNominaDPO.note">
            </mat-form-field>

            <button mat-flat-button class="btn-primary-custom align-self-center" (click)="saveNominaDPO(nuovoNominaDPO)">
                <mat-icon>save</mat-icon>
                <span>Salva</span>
            </button>
        </div>
    </div>

    <!-- Indicatore di Caricamento -->
    <div class="loading-container mb-3" *ngIf="admin && uploadingNominaDPO">
        <mat-spinner [diameter]="24"></mat-spinner>
        <span>Caricamento in corso...</span>
    </div>

    <!-- Tabella Documenti Nomina DPO -->
    <div class="table-card-container mb-3">
        <table mat-table [dataSource]="NominaDPODataSource">

            <ng-container matColumnDef="namefile">
                <th mat-header-cell *matHeaderCellDef> Nome file </th>
                <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
            </ng-container>

            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> Data Inserimento </th>
                <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
            </ng-container>

            <ng-container matColumnDef="note">
                <th mat-header-cell *matHeaderCellDef> Note </th>
                <td mat-cell *matCellDef="let element"> {{element.note || '-'}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef class="text-right"> Azioni </th>
                <td mat-cell *matCellDef="let row" class="text-right">
                    <button mat-icon-button color="primary" (click)="showDocument(row)" matTooltip="Visualizza PDF">
                        <mat-icon>picture_as_pdf</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" *ngIf="admin" (click)="deleteNominaDPO(row)" matTooltip="Elimina">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: DisplayedColumns;"></tr>

            <!-- State Vuoto Nativo -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="DisplayedColumns.length">
                    <div class="empty-state">
                        <mat-icon>description</mat-icon>
                        <p>Nessun documento presente</p>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <!-- REGOLA TASSATIVA: Paginator posizionato SEMPRE nello stesso punto DOM originale, senza *ngIf -->
    <div>
        <mat-paginator #paginatorNominaDPO [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Seleziona pagina">
        </mat-paginator>
    </div>
</div>
