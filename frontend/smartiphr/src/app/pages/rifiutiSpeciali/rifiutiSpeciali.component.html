<div class="component-container">

    <!-- Header della Pagina -->
    <div class="page-header">
        <h1 class="page-title">AREA SICUREZZA - RIFIUTI SPECIALI</h1>
    </div>

    <div class="card-form">

        <!-- Selettore dell'Anno -->
        <div class="year-selector-container">
            <button mat-icon-button class="arrow-button" (click)="cambiaAnno(-1)" [disabled]="!prev" aria-label="Anno precedente" title="Anno precedente">
                <mat-icon>chevron_left</mat-icon>
            </button>

            <span class="anno-riferimento">{{ annoRiferimento }}</span>

            <button mat-icon-button class="arrow-button" (click)="cambiaAnno(1)" [disabled]="!next" aria-label="Anno successivo" title="Anno successivo">
                <mat-icon>chevron_right</mat-icon>
            </button>
        </div>

        <!-- Contenitore Tabella Mesi -->
        <div class="table-card-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th class="col-mese">Mese</th>
                        <th class="col-data">Data</th>
                        <th class="text-center col-qty">Quantità Rifiuti Speciali</th>
                        <th class="text-center col-qty">Quantità Farmaci Scaduti</th>
                        <th class="col-firma">Firma IP</th>
                        <th class="col-note">Note</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of mesi">
                        <!-- Mese -->
                        <td class="col-mese font-weight-medium">{{ row.mese }}</td>

                        <!-- Data -->
                        <td class="col-data">
                            <ng-container *ngIf="!row.firmaIp">
                                <mat-form-field appearance="outline" class="w-100 compact-field">
                                    <mat-label>Scegli data</mat-label>
                                    <input matInput [matDatepicker]="dataI" [(ngModel)]="row.data" [max]="today">
                                    <mat-datepicker-toggle matSuffix [for]="dataI"></mat-datepicker-toggle>
                                    <mat-datepicker #dataI></mat-datepicker>
                                </mat-form-field>
                            </ng-container>
                            <ng-container *ngIf="row.firmaIp">
                                <span class="text-muted">{{ row.data | date: 'dd/MM/yyyy' }}</span>
                            </ng-container>
                        </td>

                        <!-- Quantità Rifiuti Speciali -->
                        <td class="text-center col-qty">
                            <input type="number"
                                   [(ngModel)]="row.rifiutiSpeciali"
                                   class="form-control-custom text-center"
                                   min="0"
                                   [readonly]="row.firmaIp" />
                        </td>

                        <!-- Quantità Farmaci Scaduti -->
                        <td class="text-center col-qty">
                            <input type="number"
                                   [(ngModel)]="row.farmaciScaduti"
                                   class="form-control-custom text-center"
                                   min="0"
                                   [readonly]="row.firmaIp" />
                        </td>

                        <!-- Firma IP -->
                        <td class="col-firma">
                            <ng-container *ngIf="!row.firmaIp">
                                <button mat-icon-button color="primary" (click)="firmaTurno(row)" title="Firma turno per {{ row.mese }}">
                                    <mat-icon>edit_note</mat-icon>
                                </button>
                            </ng-container>
                            <ng-container *ngIf="row.firmaIp">
                                <span class="badge-firma">{{ row.firmaIp }}</span>
                            </ng-container>
                        </td>

                        <!-- Note -->
                        <td class="col-note">
                            <textarea class="form-control-custom note-textarea"
                                      rows="1"
                                      [(ngModel)]="row.note"
                                      [readonly]="row.firmaIp"
                                      placeholder="Aggiungi note..."></textarea>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
