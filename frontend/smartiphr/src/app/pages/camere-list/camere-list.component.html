<div class="component-container">
    <!-- Header della Pagina -->
    <div class="page-header mb-4">
        <h1 class="page-title">AREA CAMERE</h1>
    </div>

    <!-- Contenitore Tabella -->
    <div class="row">
        <div class="col-12">
            <div class="table-card-container mb-3">
                <table mat-table [dataSource]="dataSourceCamere">

                    <!-- Nome Camera Column -->
                    <ng-container matColumnDef="camera">
                        <th mat-header-cell *matHeaderCellDef> Nome </th>
                        <td mat-cell *matCellDef="let element" class="font-weight-medium"> {{element.camera}} </td>
                    </ng-container>

                    <!-- Piano Column -->
                    <ng-container matColumnDef="piano">
                        <th mat-header-cell *matHeaderCellDef> Piano </th>
                        <td mat-cell *matCellDef="let element"> {{element.piano | translatepiano}} </td>
                    </ng-container>

                    <!-- Posti Liberi Column -->
                    <ng-container matColumnDef="numPostiLiberi">
                        <th mat-header-cell *matHeaderCellDef> Liberi </th>
                        <td mat-cell *matCellDef="let element"> {{element.numPostiLiberi}} </td>
                    </ng-container>

                    <!-- Posti Occupati Column -->
                    <ng-container matColumnDef="numPostiOccupati">
                        <th mat-header-cell *matHeaderCellDef> Occupati </th>
                        <td mat-cell *matCellDef="let element"> {{element.numPostiOccupati}} </td>
                    </ng-container>

                    <!-- Posti Totali Column -->
                    <ng-container matColumnDef="numMaxPosti">
                        <th mat-header-cell *matHeaderCellDef> Totale </th>
                        <td mat-cell *matCellDef="let element"> {{element.numMaxPosti}} </td>
                    </ng-container>

                    <!-- Azioni Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef class="text-end"> Azioni </th>
                        <td mat-cell *matCellDef="let row" class="text-end">
                            <div class="action-buttons-wrapper">
                                <button mat-icon-button color="primary" (click)="viewCamera(row)" matTooltip="Mostra dettagli">
                                    <mat-icon>visibility</mat-icon>
                                </button>
                                <button mat-icon-button color="primary" (click)="editCamera(row)" matTooltip="Modifica camera">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="primary" (click)="navCamera(row)" matTooltip="Mostra nella Mappa">
                                    <mat-icon>pin_drop</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <!-- State Vuoto -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                            <div class="empty-state">
                                <mat-icon>meeting_room</mat-icon>
                                <p class="m-0">Nessuna camera disponibile</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- REGOLA TASSATIVA: Paginator non toccato né spostato nell'albero DOM -->
            <div>
                <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Seleziona pagina delle camere">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
