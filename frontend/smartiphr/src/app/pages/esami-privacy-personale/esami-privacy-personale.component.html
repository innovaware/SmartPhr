        <!-- REGOLAMENTO -->
        <mat-tab label="Regolamento interno">
            <div class="py-3">
                <mat-card class="p-3 mb-3 mat-elevation-z1">
                    <div class="row align-items-center">
                        <div class="col-md-8 col-sm-12">
                            <div class="form-check form-switch d-flex align-items-center gap-2">
                                <input class="form-check-input" type="checkbox" id="presa" [(ngModel)]="dipendente.accettatoRegolamento" style="width: 2.5em; height: 1.25em;" />
                                <label class="form-check-label fw-bold" for="presa" style="font-size: 1.1rem; cursor: pointer;">
                                    Presa visione Regolamento interno.
                                </label>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-12 text-md-end mt-3 mt-md-0 d-flex align-items-center justify-content-md-end gap-2">
                            <span *ngIf="uploadingRegolamento" class="text-success fw-bold d-flex align-items-center">
                                <mat-icon class="me-1">check_circle</mat-icon> Modifica avvenuta con successo.
                            </span>
                            <button mat-raised-button color="primary" (click)="saveDipendente()" title="Salva">
                                <mat-icon>save</mat-icon>
                                <span class="ms-1">Salva</span>
                            </button>
                        </div>
                    </div>
                </mat-card>
                <div class="pdf-container mb-4 border rounded overflow-hidden" style="height: 600px;">
                    <iframe *ngIf="pdfSrc" [src]="pdfSrc" frameBorder="0" scrolling="auto" height="100%" width="100%"></iframe>
                </div>


                <!--<button mat-button class="button-insert" (click)="saveDipendente(false)">Salva</button>-->
            </div>
        </mat-tab>

        <!-- PRIVACY -->
        <mat-tab label="Privacy">
            <div class="py-3">

                <!-- Pulsante Aggiungi Documento -->
                <div class="mb-3" *ngIf="!addingPrivacy">
                    <button mat-raised-button color="primary" (click)="addPrivacy()">
                        <mat-icon>add</mat-icon>
                        <span class="ms-1">Aggiungi Documento</span>
                    </button>
                </div>

                <!-- Form Inserimento Privacy -->
                <mat-card class="mb-4 p-3 mat-elevation-z2" *ngIf="addingPrivacy && !uploadingPrivacy">
                    <mat-card-header class="mb-2">
                        <mat-card-title style="font-size: 1.1rem; color: #1976d2;">Nuovo Documento Privacy</mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Seleziona File (PDF)</label>
                                <input class="form-control" type="file" (change)="uploadPrivacy($event)" accept=".pdf" *ngIf="!uploadingPrivacy">
                                <label *ngIf="uploadingPrivacy" class="text-muted">Caricamento in corso ...</label>
                            </div>
                            <div class="col-md-9">
                                <mat-form-field appearance="outline" class="w-100">
                                    <mat-label>Note</mat-label>
                                    <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovoPrivacy.note">
                                    <mat-icon matSuffix>note</mat-icon>
                                </mat-form-field>
                            </div>
                            <div class="col-md-3 d-flex align-items-center justify-content-end gap-2">
                                <button mat-raised-button color="primary" (click)="savePrivacy(nuovoPrivacy)" title="Salva">
                                    <mat-icon>save</mat-icon>
                                    <span class="ms-1">Salva</span>
                                </button>
                                <button mat-button (click)="addingPrivacy = false" title="Annulla">
                                    <mat-icon>close</mat-icon>
                                    <span class="ms-1">Annulla</span>
                                </button>
                            </div>
                        </div>
                    </mat-card-content>
                </mat-card>

                <!-- Loading Spinner -->
                <div class="my-4" *ngIf="uploadingPrivacy">
                    <div class="d-flex align-items-center gap-3">
                        <mat-spinner [diameter]="28"></mat-spinner>
                        <span class="text-muted">Caricamento in corso ...</span>
                    </div>
                </div>

                <!-- Messaggio Nessun Documento -->
                <div *ngIf="!docsprivacy || docsprivacy.length === 0" class="alert alert-info text-center my-3" role="alert">
                    <mat-icon class="align-middle me-1">info</mat-icon>
                    Nessun documento presente in archivio.
                </div>

                <!-- Tabella Privacy -->
                <div class="table-responsive mat-elevation-z8 rounded-2 overflow-hidden" *ngIf="docsprivacy && docsprivacy.length > 0">
                    <table mat-table [dataSource]="docsprivacyDataSource" class="w-100">

                        <!-- Nome File -->
                        <ng-container matColumnDef="namefile">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Nome file </th>
                            <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
                        </ng-container>

                        <!-- Data Inserimento -->
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Data Inserimento </th>
                            <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
                        </ng-container>

                        <!-- Note -->
                        <ng-container matColumnDef="note">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Note </th>
                            <td mat-cell *matCellDef="let element"> {{element.note || '-'}} </td>
                        </ng-container>

                        <!-- Azioni -->
                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef class="text-end fw-bold text-uppercase"> Azioni </th>
                            <td mat-cell *matCellDef="let row" class="text-end">
                                <label *ngIf="uploadingPrivacy" class="text-muted me-2">Caricamento in corso ...</label>

                                <button mat-icon-button color="primary" (click)="showDocument(row)" title="Visualizza PDF">
                                    <mat-icon color="warn">picture_as_pdf</mat-icon>
                                </button>

                                <button mat-icon-button color="warn" (click)="deletePrivacy(row)" title="Elimina">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: DisplayedColumns;" class="table-row-hover"></tr>
                    </table>

                    <!-- Paginatore -->
                    <mat-paginator #paginatorPrivacy [pageSizeOptions]="[5,10,20]" showFirstLastButtons aria-label="Seleziona pagina">
                    </mat-paginator>
                </div>

            </div>
        </mat-tab>

    </mat-tab-group>

    <div mat-dialog-actions>
        <div class="bottom-actions">
            <!--<button mat-button class="button-insert" (click)="save(false)">Salva</button>-->
        </div>
    </div>

</div>
