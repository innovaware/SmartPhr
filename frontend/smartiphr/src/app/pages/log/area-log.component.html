<div class="w-100 overflow-hidden" *ngIf="sa">
    <!-- Intestazione Pagina -->
    <div class="row align-items-center mb-3">
        <div class="col">
            <h1 class="title m-0">Area Log</h1>
        </div>
    </div>

    <hr class="mb-4">

    <!-- Campo Ricerca -->
    <div class="row mb-3">
        <div class="col-md-6 col-sm-12">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Cerca</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Cerca log per data o conteggio..." [(ngModel)]="inputSearchField">
                <button mat-icon-button matSuffix *ngIf="inputSearchField" (click)="cleanSearchField()" title="Pulisci ricerca">
                    <mat-icon>clear</mat-icon>
                </button>
                <mat-icon matSuffix *ngIf="!inputSearchField">search</mat-icon>
            </mat-form-field>
        </div>
    </div>

    <!-- Tabella Area Log -->
    <div class="row">
        <div class="col p-0">
            <div class="table-responsive mat-elevation-z8 rounded-2 overflow-hidden mb-3">
                <table mat-table [dataSource]="dataSource" style="width: 100%;">

                    <!-- Colonna Data Log -->
                    <ng-container matColumnDef="data">
                        <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Data Log </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="d-flex align-items-center gap-2">
                                <mat-icon color="primary">calendar_today</mat-icon>
                                <span>{{element.data | date: 'dd/MM/yyyy'}}</span>
                            </div>
                        </td>
                    </ng-container>

                    <!-- Colonna Count -->
                    <ng-container matColumnDef="numLog">
                        <th mat-header-cell *matHeaderCellDef class="text-center fw-bold text-uppercase"> Conteggio Log </th>
                        <td mat-cell *matCellDef="let element" class="text-center">
                            <span class="badge bg-secondary text-white px-2 py-1 fs-6">
                                {{element.logList?.length || 0}}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Colonna Visualizza -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef class="text-end fw-bold text-uppercase"> Visualizza </th>
                        <td mat-cell *matCellDef="let row" class="text-end">
                            <button mat-icon-button color="primary" (click)="viewLog(row)" title="Visualizza Dettagli Log">
                                <mat-icon>visibility</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: DisplayedColumns;" class="table-row-hover"></tr>
                </table>

                <!-- Paginatore -->
                <mat-paginator #paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Seleziona pagina">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>

<!-- VISTA PERMESSO NEGATO -->
<div class="d-flex justify-content-center align-items-center min-vh-50 py-5" *ngIf="!sa">
    <mat-card class="mat-elevation-z4 p-4 text-center max-w-500 rounded-3">
        <mat-card-content class="d-flex flex-column align-items-center">
            <img src="../../../assets/larinascitasrl.jpg" alt="Logo" class="mb-3 rounded logo-img">
            <mat-icon class="text-danger mb-2" style="font-size: 48px; width: 48px; height: 48px;">gpp_bad</mat-icon>
            <h2 class="fs-5 fw-bold text-secondary mb-2">Accesso Negato</h2>
            <p class="text-muted m-0">Non si hanno i permessi necessari per visualizzare questa pagina.</p>
        </mat-card-content>
    </mat-card>
</div>
