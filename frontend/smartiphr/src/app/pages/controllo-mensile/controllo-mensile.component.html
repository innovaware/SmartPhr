<div class="main-card-container">
    <!-- Header del Componente -->
    <div class="component-header mb-4">
        <h1 class="component-title">AREA QUALITÀ - Controllo Mensile</h1>
    </div>

    <!-- Toolbar Filtro e Inserimento -->
    <div class="toolbar-container mb-3">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Cerca</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Cerca qui..." [(ngModel)]="inputSearchField">
            <button mat-icon-button matSuffix *ngIf="inputSearchField" (click)="cleanSearchField()" aria-label="Pulisci">
                <mat-icon>close</mat-icon>
            </button>
            <mat-icon matSuffix *ngIf="!inputSearchField">search</mat-icon>
        </mat-form-field>

        <button mat-raised-button class="btn-primary" (click)="AddEsito()">
            <mat-icon>add</mat-icon>
            <span>Aggiungi esito Controllo</span>
        </button>
    </div>

    <!-- Contenitore Tabella Controllo Mensile -->
    <div class="table-card-container">
        <table mat-table [dataSource]="dataSourceControlloMensile" class="mat-elevation-z8">

            <ng-container matColumnDef="dataControllo">
                <th mat-header-cell *matHeaderCellDef> Data Controllo </th>
                <td mat-cell *matCellDef="let element"> {{element.dataControllo | date: 'dd/MM/yyyy'}} </td>
            </ng-container>

            <ng-container matColumnDef="utenteNome">
                <th mat-header-cell *matHeaderCellDef> Utente </th>
                <td mat-cell *matCellDef="let element"> {{element.utenteNome}} </td>
            </ng-container>

            <ng-container matColumnDef="esitoPositivo">
                <th mat-header-cell *matHeaderCellDef> Esito </th>
                <td mat-cell *matCellDef="let element">
                    <mat-icon class="status-icon success" *ngIf="element.esitoPositivo">check_circle</mat-icon>
                    <mat-icon class="status-icon error" *ngIf="!element.esitoPositivo">cancel</mat-icon>
                </td>
            </ng-container>

            <ng-container matColumnDef="tipo">
                <th mat-header-cell *matHeaderCellDef> Tipologia </th>
                <td mat-cell *matCellDef="let element"> {{element.tipologia}} </td>
            </ng-container>

            <ng-container matColumnDef="note">
                <th mat-header-cell *matHeaderCellDef> Note </th>
                <td mat-cell *matCellDef="let element"> {{element.note}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: DisplayedColumns;"></tr>
        </table>
    </div>

    <!-- Paginatore orfano originale (intatto e nella stessa posizione) -->
    <div class="paginator-container">
        <mat-paginator #paginatorControllo [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>

    <!-- Stato Vuoto (quando la tabella non ha dati) -->
    <div class="empty-state" *ngIf="!dataSourceControlloMensile || dataSourceControlloMensile.data?.length === 0">
        <mat-icon>fact_check</mat-icon>
        <p>Nessun controllo mensile disponibile</p>
    </div>
</div>
