<div class="container pad">
    <!-- Intestazione Pagina -->
    <div class="row align-items-center mb-3">
        <div class="col">
            <h1 class="title m-0">HACCP - Controlli Tamponi</h1>
        </div>
        <div class="col-auto" *ngIf="!addingDocument">
            <button mat-raised-button color="primary" (click)="AddDocument()">
                <mat-icon>add</mat-icon>
                <span class="ms-1">Aggiungi Documento</span>
            </button>
        </div>
    </div>

    <hr class="mb-4">

    <!-- Form Inserimento Documento -->
    <mat-card class="mb-4 p-3 mat-elevation-z2" *ngIf="addingDocument">
        <mat-card-header class="mb-2" *ngIf="!uploadingDocumento">
            <mat-card-title style="font-size: 1.1rem; color: #1976d2;">Nuovo Documento Controllo Tamponi</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <!-- Stato 1: Selezione File e Note -->
            <div class="row g-3" *ngIf="!uploadingDocumento">
                <div class="col-md-12">
                    <label class="form-label fw-bold">Seleziona File (PDF)</label>
                    <input class="form-control" type="file" accept=".pdf" (change)="uploadDocumento($event)">
                </div>

                <div class="col-md-9">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Note</mat-label>
                        <input matInput placeholder="Inserisci delle note sul documento" [(ngModel)]="nuovoDocumento.note">
                        <mat-icon matSuffix>note</mat-icon>
                    </mat-form-field>
                </div>

                <div class="col-md-3 d-flex align-items-center justify-content-end gap-2">
                    <button mat-raised-button color="primary" (click)="saveDocumento(nuovoDocumento)" title="Salva">
                        <mat-icon>save</mat-icon>
                        <span class="ms-1">Salva</span>
                    </button>
                    <button mat-button (click)="addingDocument = false" title="Annulla">
                        <mat-icon>close</mat-icon>
                        <span class="ms-1">Annulla</span>
                    </button>
                </div>
            </div>

            <!-- Stato 2: Caricamento Spinner -->
            <div class="my-3 d-flex align-items-center gap-3" *ngIf="uploadingDocumento">
                <mat-spinner [diameter]="28"></mat-spinner>
                <span class="text-muted">Caricamento in corso...</span>
            </div>
        </mat-card-content>
    </mat-card>

    <!-- Tabella Documenti -->
    <div class="table-responsive mat-elevation-z8 rounded-2 overflow-hidden mb-3">
        <table mat-table [dataSource]="documentiDataSource" style="width: 100%;">

            <!-- Nome file Column -->
            <ng-container matColumnDef="namefile">
                <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Nome file </th>
                <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
            </ng-container>

            <!-- Data Inserimento Column -->
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Data Inserimento </th>
                <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
            </ng-container>

            <!-- Note Column -->
            <ng-container matColumnDef="note">
                <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase"> Note </th>
                <td mat-cell *matCellDef="let element"> {{element.note || '-'}} </td>
            </ng-container>

            <!-- Azioni Column -->
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef class="text-end fw-bold text-uppercase"> Azioni </th>
                <td mat-cell *matCellDef="let row" class="text-end">
                    <button mat-icon-button color="primary" (click)="showDocument(row)" title="Visualizza PDF">
                        <mat-icon color="warn">picture_as_pdf</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteDocument(row)" title="Elimina Documento">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="documentiDisplayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: documentiDisplayedColumns;" class="table-row-hover"></tr>

            <!-- Stato vuoto -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center p-4 text-muted" [attr.colspan]="documentiDisplayedColumns.length">
                    <mat-icon class="align-middle me-1">info</mat-icon>
                    Nessun documento di controllo tamponi caricato.
                </td>
            </tr>
        </table>

        <!-- Paginatore -->
        <mat-paginator #paginatorDocumenti [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Seleziona pagina">
        </mat-paginator>
    </div>

</div>
