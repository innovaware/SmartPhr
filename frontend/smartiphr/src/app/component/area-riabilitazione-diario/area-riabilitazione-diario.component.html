<div class="component-container">
    <div class="card-form">

        <!-- Intestazione della Sezione -->
        <div class="section-toolbar">
            <h3 class="card-title m-0">Diario Riabilitativo</h3>
            <button mat-flat-button color="primary" class="btn-primary-custom" (click)="addNewDiario()" *ngIf="!disable">
                <mat-icon>add</mat-icon> Nuovo Diario
            </button>
        </div>

        <!-- Stato Vuoto (Nessun elemento) -->
        <div *ngIf="!dataSourceRiabilitativaDiario || dataSourceRiabilitativaDiario.data?.length === 0" class="empty-state">
            <mat-icon class="empty-icon">menu_book</mat-icon>
            <p>Nessun elemento presente nel diario</p>
        </div>

        <!-- Contenitore Tabella -->
        <div class="table-card-container" *ngIf="dataSourceRiabilitativaDiario && dataSourceRiabilitativaDiario.data?.length > 0">
            <table mat-table [dataSource]="dataSourceRiabilitativaDiario" class="custom-table">

                <!-- Azioni Column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="col-action"> Azioni </th>
                    <td mat-cell *matCellDef="let row" class="col-action"></td>
                </ng-container>

                <!-- Data Column -->
                <ng-container matColumnDef="data">
                    <th mat-header-cell *matHeaderCellDef class="col-date"> Data </th>
                    <td mat-cell *matCellDef="let element" class="col-date font-weight-medium">
                        {{element.data | date: 'dd/MM/yyyy':'UTC'}}
                    </td>
                </ng-container>

                <!-- Controllo Column (Simboli Fisioterapista) -->
                <ng-container matColumnDef="control">
                    <th mat-header-cell *matHeaderCellDef class="col-control"> Controllo (FT) </th>
                    <td mat-cell *matCellDef="let element" class="col-control">
                        <span *ngIf="element.controllo == 1" class="status-indicator status-up" title="Miglioramento / Positivo">&#x25B2;</span>
                        <span *ngIf="element.controllo == 2" class="status-indicator status-stable" title="Stabile">&#x25FC;</span>
                        <span *ngIf="element.controllo == 3" class="status-indicator status-down" title="Peggioramento / Negativo">&#x25BC;</span>
                        <span *ngIf="!element.controllo" class="text-muted">-</span>
                    </td>
                </ng-container>

                <!-- Diario Riabilitativo / Note Column -->
                <ng-container matColumnDef="note">
                    <th mat-header-cell *matHeaderCellDef> Diario Riabilitativo </th>
                    <td mat-cell *matCellDef="let element" class="text-content">
                        {{element.note || '-'}}
                    </td>
                </ng-container>

                <!-- Firma Column -->
                <ng-container matColumnDef="firma">
                    <th mat-header-cell *matHeaderCellDef class="col-firma"> Firma </th>
                    <td mat-cell *matCellDef="let element" class="col-firma text-muted">
                        {{element.firma || '-'}}
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <!-- Paginatore -->
            <mat-paginator #paginatorDiarioRiabilitativo
                           [pageSizeOptions]="[5, 10, 20]"
                           showFirstLastButtons
                           class="custom-paginator"
                           aria-label="Seleziona la pagina">
            </mat-paginator>
        </div>

    </div>
</div>
