<div class="container-fluid py-3">
    <div class="row g-3">

        <!-- VALUTAZIONE SOCIALE -->
        <div class="col-12">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>VALUTAZIONE SOCIALE</mat-card-title>
                </mat-card-header>
                <mat-card-content class="pt-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Valutazione Sociale</mat-label>
                        <textarea matInput
                                  readonly
                                  cdkTextareaAutosize
                                  [cdkAutosizeMinRows]="2"
                                  [ngModel]="data?.schedaAssSociale?.valutazioneSociale?.valutazione || ''">
            </textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>

        <!-- VALUTAZIONE EDUCATIVA -->
        <div class="col-12">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>VALUTAZIONE EDUCATIVA</mat-card-title>
                </mat-card-header>
                <mat-card-content class="pt-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Valutazione Educativa</mat-label>
                        <textarea matInput
                                  readonly
                                  cdkTextareaAutosize
                                  [cdkAutosizeMinRows]="2"
                                  [ngModel]="data?.schedaEducativa?.valutazioneEducativa?.valutazione || ''">
            </textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>

        <!-- VALUTAZIONE PSICOLOGICA -->
        <div class="col-12">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>VALUTAZIONE PSICOLOGICA</mat-card-title>
                </mat-card-header>
                <mat-card-content class="pt-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Valutazione Psicologica</mat-label>
                        <textarea matInput
                                  readonly
                                  cdkTextareaAutosize
                                  [cdkAutosizeMinRows]="2"
                                  [ngModel]="data?.schedaPsico?.valutazione || ''">
            </textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>

        <!-- VALUTAZIONE MOTORIA -->
        <div class="col-12">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>VALUTAZIONE MOTORIA</mat-card-title>
                </mat-card-header>
                <mat-card-content class="pt-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Valutazione Motoria</mat-label>
                        <textarea matInput
                                  readonly
                                  cdkTextareaAutosize
                                  [cdkAutosizeMinRows]="2"
                                  [ngModel]="data?.valutazioneMotoria?.valutazione || ''">
            </textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>

    </div>
</div>
