<div class="container-fluid py-3 cartella-sociale-container">

    <!-- Motivo del ricovero -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="card-title m-0 text-primary fw-bold">Motivo del Ricovero</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-6 col-lg-4">
                    <div class="form-check form-switch custom-switch-card">
                        <input class="form-check-input" type="checkbox" id="perditaautonomia" [(ngModel)]="data.perditaautonomia">
                        <label class="form-check-label" for="perditaautonomia">Perdita dell’autonomia</label>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="form-check form-switch custom-switch-card">
                        <input class="form-check-input" type="checkbox" id="alloggioinidoneo" [(ngModel)]="data.alloggioinidoneo">
                        <label class="form-check-label" for="alloggioinidoneo">Alloggio inidoneo</label>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="form-check form-switch custom-switch-card">
                        <input class="form-check-input" type="checkbox" id="statosalute" [(ngModel)]="data.statosalute">
                        <label class="form-check-label" for="statosalute">Stato di salute</label>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="form-check form-switch custom-switch-card">
                        <input class="form-check-input" type="checkbox" id="impossibfamigliaassistere" [(ngModel)]="data.impossibfamigliaassistere">
                        <label class="form-check-label" for="impossibfamigliaassistere">Impossibilità famiglia ad assistere</label>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="form-check form-switch custom-switch-card">
                        <input class="form-check-input" type="checkbox" id="rapportifamiliaridifficili" [(ngModel)]="data.rapportifamiliaridifficili">
                        <label class="form-check-label" for="rapportifamiliaridifficili">Rapporti familiari difficili</label>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="form-check form-switch custom-switch-card">
                        <input class="form-check-input" type="checkbox" id="solitudine" [(ngModel)]="data.solitudine">
                        <label class="form-check-label" for="solitudine">Solitudine</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch custom-switch-card mb-2">
                        <input class="form-check-input" type="checkbox" id="trasfdaaltro" [(ngModel)]="data.trasfdaaltro">
                        <label class="form-check-label" for="trasfdaaltro">Trasferimento da altro Istituto</label>
                    </div>
                    <div *ngIf="data.trasfdaaltro" class="mt-2">
                        <input class="form-control" type="text" [(ngModel)]="data.istituto" placeholder="Inserisci il nome dell'Istituto">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch custom-switch-card mb-2">
                        <input class="form-check-input" type="checkbox" id="altro" [(ngModel)]="data.altro">
                        <label class="form-check-label" for="altro">Altro motivo</label>
                    </div>
                    <div *ngIf="data.altro" class="mt-2">
                        <input class="form-control" type="text" [(ngModel)]="data.altrotext" placeholder="Specificare il motivo">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Situazione Socio-Sanitaria -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="card-title m-0 text-primary fw-bold">Situazione Socio-Sanitaria e Tutela</h5>
        </div>
        <div class="card-body">
            <div class="row g-3 align-items-center">

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Invalidità Civile</label>
                    <mat-radio-group [(ngModel)]="data.invaliditacivile" (change)="change()" class="d-flex gap-3 mt-1">
                        <mat-radio-button [value]="1">SÌ</mat-radio-button>
                        <mat-radio-button [value]="0">NO</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Assegno di Accompagnamento</label>
                    <select class="form-select" [(ngModel)]="data.assdiaccompagnamento">
                        <option value="">Seleziona...</option>
                        <option value="0">NO</option>
                        <option value="1">IN CORSO</option>
                        <option value="2">SÌ</option>
                    </select>
                </div>

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Acc. Integrata L.104/92</label>
                    <select class="form-select" [(ngModel)]="data.accintegrata">
                        <option value="">Seleziona...</option>
                        <option value="0">NON RICHIESTA</option>
                        <option value="1">RICHIESTA</option>
                        <option value="2">OTTENUTA</option>
                    </select>
                </div>

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Esenzione Ticket</label>
                    <mat-radio-group [(ngModel)]="data.esenzioneticket" (change)="change()" class="d-flex gap-3 mt-1">
                        <mat-radio-button [value]="1">SÌ</mat-radio-button>
                        <mat-radio-button [value]="0">NO</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="col-md-6 col-lg-8">
                    <label class="form-label fw-semibold text-secondary">Ausili</label>
                    <div class="d-flex align-items-center gap-3">
                        <mat-radio-group [(ngModel)]="data.ausili" (change)="change()" class="d-flex gap-3">
                            <mat-radio-button [value]="true">SÌ</mat-radio-button>
                            <mat-radio-button [value]="false">NO</mat-radio-button>
                        </mat-radio-group>
                        <input *ngIf="data.ausili === true " class="form-control" type="text" [(ngModel)]="data.ausilialtro" placeholder="Quali ausili?">
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Interdizione</label>
                    <mat-radio-group [(ngModel)]="data.interdizione" (change)="change()" class="d-flex gap-3 mt-1">
                        <mat-radio-button [value]="1">SÌ</mat-radio-button>
                        <mat-radio-button [value]="0">NO</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Inabilitazione</label>
                    <mat-radio-group [(ngModel)]="data.inabilitazione" (change)="change()" class="d-flex gap-3 mt-1">
                        <mat-radio-button [value]="1">SÌ</mat-radio-button>
                        <mat-radio-button [value]="0">NO</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Amministratore di Sostegno</label>
                    <mat-radio-group [(ngModel)]="data.ammsostesgno" (change)="change()" class="d-flex gap-3 mt-1">
                        <mat-radio-button [value]="1">SÌ</mat-radio-button>
                        <mat-radio-button [value]="0">NO</mat-radio-button>
                    </mat-radio-group>
                </div>

            </div>
        </div>
    </div>

    <!-- Medici e Referenti -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="card-title m-0 text-primary fw-bold">Medici e Referenti</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-6 col-lg-4">
                    <label class="form-label fw-semibold text-secondary">Medico di M.G.</label>
                    <input class="form-control" type="text" [(ngModel)]="data.medicomg">
                </div>

                <div class="col-md-6 col-lg-2">
                    <label class="form-label fw-semibold text-secondary">Tel. Medico</label>
                    <input class="form-control" type="text" [(ngModel)]="data.tel">
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Referente</label>
                    <input class="form-control" type="text" [(ngModel)]="data.referente">
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Indirizzo (Via)</label>
                    <input class="form-control" type="text" [(ngModel)]="data.via">
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Città</label>
                    <input class="form-control" type="text" [(ngModel)]="data.citta" (change)="change()">
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Tel. Referente</label>
                    <input class="form-control" type="text" [(ngModel)]="data.telref" (change)="change()">
                </div>

            </div>
        </div>
    </div>

    <!-- Famiglia e Supporto -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="card-title m-0 text-primary fw-bold">Famiglia e Supporto Assistenziale</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">

                <div class="col-12">
                    <label class="form-label fw-semibold text-secondary">Nucleo Familiare <small class="fw-normal text-muted">(Grado di parentela e recapito)</small></label>
                    <textarea class="form-control" rows="2" [(ngModel)]="data.nucleo"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Disponibilità Assistenziale Familiari</label>
                    <select class="form-select" [(ngModel)]="data.dispassFam">
                        <option value="">Seleziona...</option>
                        <option value="0">ASSENTE</option>
                        <option value="1">POSSIBILE</option>
                        <option value="2">PRESENTE</option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <h6 class="text-secondary fw-bold mb-3">Disponibilità specifica dei familiari:</h6>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label text-muted d-block fs-7">Visite in struttura</label>
                            <mat-radio-group [(ngModel)]="data.dispvisite" (change)="change()" class="d-flex gap-3">
                                <mat-radio-button [value]="1">SÌ</mat-radio-button>
                                <mat-radio-button [value]="0">NO</mat-radio-button>
                            </mat-radio-group>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-muted d-block fs-7">Ospitare per brevi periodi</label>
                            <mat-radio-group [(ngModel)]="data.ospiteperperiodi" (change)="change()" class="d-flex gap-3">
                                <mat-radio-button [value]="1">SÌ</mat-radio-button>
                                <mat-radio-button [value]="0">NO</mat-radio-button>
                            </mat-radio-group>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-muted d-block fs-7">Accompagnamento visite</label>
                            <mat-radio-group [(ngModel)]="data.accpervisite" (change)="change()" class="d-flex gap-3">
                                <mat-radio-button [value]="1">SÌ</mat-radio-button>
                                <mat-radio-button [value]="0">NO</mat-radio-button>
                            </mat-radio-group>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Abitazione e Ambiente di Vita -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="card-title m-0 text-primary fw-bold">Abitazione e Ambiente di Vita</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Attuale Abitazione</label>
                    <select class="form-select" [(ngModel)]="data.abitazione">
                        <option value="">Seleziona...</option>
                        <option value="0">AFFITTO</option>
                        <option value="1">USUFRUTTO</option>
                        <option value="2">PROPRIETÀ</option>
                    </select>
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Altro tipo abitazione</label>
                    <input class="form-control" type="text" [(ngModel)]="data.abitazionealtro">
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Dislocazione</label>
                    <select class="form-select" [(ngModel)]="data.dislocazione">
                        <option value="">Seleziona...</option>
                        <option value="0">ISOLATA</option>
                        <option value="1">POCO SERVITA</option>
                        <option value="2">CENTRALE E SERVITA</option>
                    </select>
                </div>

                <div class="col-md-6 col-lg-3">
                    <label class="form-label fw-semibold text-secondary">Barriere Architettoniche</label>
                    <select class="form-select" [(ngModel)]="data.barriere">
                        <option value="">Seleziona...</option>
                        <option value="0">INT. ED EST.</option>
                        <option value="1">SOLO ESTERNE</option>
                        <option value="2">SOLO INTERNE</option>
                        <option value="3">ASSENTI</option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <h6 class="text-secondary fw-bold mb-3">Servizi minimi nell'abitazione:</h6>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label text-muted d-block fs-7">Bagno vasca/doccia</label>
                            <mat-radio-group [(ngModel)]="data.bagno" (change)="change()" class="d-flex gap-3">
                                <mat-radio-button [value]="1">SÌ</mat-radio-button>
                                <mat-radio-button [value]="0">NO</mat-radio-button>
                            </mat-radio-group>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-muted d-block fs-7">Telefono</label>
                            <mat-radio-group [(ngModel)]="data.telefono" (change)="change()" class="d-flex gap-3">
                                <mat-radio-button [value]="1">SÌ</mat-radio-button>
                                <mat-radio-button [value]="0">NO</mat-radio-button>
                            </mat-radio-group>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-muted d-block fs-7">Riscaldamento</label>
                            <mat-radio-group [(ngModel)]="data.riscaldamento" (change)="change()" class="d-flex gap-3">
                                <mat-radio-button [value]="1">SÌ</mat-radio-button>
                                <mat-radio-button [value]="0">NO</mat-radio-button>
                            </mat-radio-group>
                        </div>
                    </div>
                </div>

                <hr class="my-4 text-muted opacity-25">

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary d-block">Ha cambiato spesso residenza?</label>
                    <mat-radio-group [(ngModel)]="data.cambiospessoresidenza" (change)="change()" class="d-flex gap-3 mt-1">
                        <mat-radio-button [value]="1">SÌ</mat-radio-button>
                        <mat-radio-button [value]="0">NO</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Contatti con ambiente di vita</label>
                    <select class="form-select" [(ngModel)]="data.contattimantenuti">
                        <option value="">Seleziona...</option>
                        <option value="0">Amici</option>
                        <option value="1">Familiari</option>
                        <option value="2">Vicinato</option>
                    </select>
                </div>

            </div>
        </div>
    </div>

</div>
