<div class="component-container">

    <!-- Toolbar con campo di ricerca e pulsante di aggiunta -->
    <div class="table-toolbar">
        <div class="search-field-container">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Cerca tra i documenti</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Digita per filtrare..." [(ngModel)]="inputSearchField">
                <button mat-icon-button matSuffix (click)="cleanSearchField()" *ngIf="inputSearchField" aria-label="Pulisci ricerca">
                    <mat-icon>close</mat-icon>
                </button>
                <mat-icon matSuffix *ngIf="!inputSearchField">search</mat-icon>
            </mat-form-field>
        </div>

        <button mat-flat-button color="primary" class="btn-primary-custom" (click)="addverificheInt()" *ngIf="!addingverificheInt">
            <mat-icon>add</mat-icon> Aggiungi Documento
        </button>
    </div>

    <!-- Form Inserimento Documento -->
    <div class="card-form" *ngIf="addingverificheInt && !uploadingverificheInt">
        <h4 class="card-title">Carica Nuovo Documento</h4>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label-custom">Seleziona File (PDF)</label>
                <input type="file" class="form-control-custom" (change)="uploadverificheInt($event)" accept=".pdf">
            </div>
            <div class="col-md-6 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Note</mat-label>
                    <input matInput placeholder="Inserisci delle note" [(ngModel)]="nuovoverificheInt.note">
                </mat-form-field>
            </div>
        </div>
        <div class="d-flex justify-content-end">
            <button mat-raised-button color="primary" class="btn-primary-custom" (click)="saveverificheInt(nuovoverificheInt)">
                Salva Documento
            </button>
        </div>
    </div>

    <!-- Spinner di Caricamento -->
    <div class="spinner-container" *ngIf="uploadingverificheInt">
        <mat-spinner [diameter]="32"></mat-spinner>
        <span>Caricamento in corso...</span>
    </div>

    <!-- Stato Vuoto -->
    <div *ngIf="!verificheInt || verificheInt.length === 0" class="empty-state">
        <mat-icon class="empty-icon">description</mat-icon>
        <p>Nessun documento presente</p>
    </div>

    <!-- Tabella Documenti -->
    <div class="table-card-container" *ngIf="verificheInt && verificheInt.length > 0">
        <table mat-table [dataSource]="verificheIntDataSource" class="custom-table">

            <!-- Nome File Column -->
            <ng-container matColumnDef="namefile">
                <th mat-header-cell *matHeaderCellDef> Nome file </th>
                <td mat-cell *matCellDef="let element" class="font-weight-medium"> {{element.filename}} </td>
            </ng-container>

            <!-- Data Inserimento Column -->
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> Data Inserimento </th>
                <td mat-cell *matCellDef="let element"> {{element.dateupload | date: 'dd/MM/yyyy'}} </td>
            </ng-container>

            <!-- Note Column -->
            <ng-container matColumnDef="note">
                <th mat-header-cell *matHeaderCellDef> Note </th>
                <td mat-cell *matCellDef="let element" class="text-muted"> {{element.note || '-'}} </td>
            </ng-container>

            <!-- Action Column -->
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef class="text-end"> Azioni </th>
                <td mat-cell *matCellDef="let row" class="text-end">
                    <button mat-icon-button color="primary" matTooltip="Visualizza PDF" (click)="showDocument(row)">
                        <mat-icon>picture_as_pdf</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" matTooltip="Elimina" (click)="deleteverificheInt(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: DisplayedColumns;"></tr>
        </table>

        <mat-paginator #paginatorverificheInt
                       [pageSizeOptions]="[5,10,20]"
                       showFirstLastButtons
                       class="custom-paginator"
                       aria-label="Seleziona la pagina">
        </mat-paginator>
    </div>

</div>
