<div class="component-container">
    <div class="card-form">

        <!-- Titolo della Scheda -->
        <h3 class="card-title">Socializzazione</h3>

        <!-- Campi Informazioni Generali -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>È interessato a</mat-label>
                    <input matInput placeholder="Inserisci interessi" [(ngModel)]="data.interesse">
                </mat-form-field>
            </div>

            <div class="col-md-6 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Ha interesse per</mat-label>
                    <input matInput placeholder="Inserisci iniziative o preferenze" [(ngModel)]="data.iniziativa">
                </mat-form-field>
            </div>

            <div class="col-12 mb-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Sta volentieri in compagnia con</mat-label>
                    <textarea matInput rows="2" placeholder="Specificare con chi sta volentieri in compagnia..." [(ngModel)]="data.compagnia"></textarea>
                </mat-form-field>
            </div>
        </div>

        <!-- Sezione Hobbies -->
        <div class="section-divider">
            <h4 class="section-subtitle">Hobbies</h4>
        </div>

        <!-- Griglia Checkbox Hobbies -->
        <div class="hobbies-grid">
            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyScrittura">
                <span>Scrittura</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyBallo">
                <span>Ballo</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyBricolage">
                <span>Bricolage</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyLettura">
                <span>Lettura</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyDisegno">
                <span>Disegno</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyPittura">
                <span>Pittura</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyAttMotoria">
                <span>Attività motoria</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyGiochi">
                <span>Giochi</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyTV">
                <span>TV</span>
            </label>

            <label class="hobby-item">
                <input type="checkbox" class="form-check-input custom-checkbox" [(ngModel)]="data.hobbyCucina">
                <span>Cucina</span>
            </label>
        </div>

        <!-- Campo Altro -->
        <div class="mt-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Altro</mat-label>
                <textarea matInput rows="2" placeholder="Eventuali altri hobbies o note..." [(ngModel)]="data.hobbyAltro"></textarea>
            </mat-form-field>
        </div>

    </div>
</div>
