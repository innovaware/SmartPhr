<div class="component-container">
    <div class="card-form">

        <!-- Titolo della Sezione -->
        <h3 class="card-title">Valutazione Educativa</h3>

        <!-- Campo di Testo della Valutazione -->
        <div class="row">
            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Inserisci la valutazione educativa...</mat-label>
                    <textarea matInput
                              rows="8"
                              placeholder="Digitare qui le note e le osservazioni della valutazione educativa..."
                              [disabled]="disable"
                              [(ngModel)]="data.valutazione">
          </textarea>
                </mat-form-field>
            </div>
        </div>

    </div>
</div>
