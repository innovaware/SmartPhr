<div class="component-container">
    <div class="card-form">

        <!-- Intestazione con Cerca e Pulsante Aggiungi -->
        <div class="table-toolbar">
            <div class="search-field-container">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Cerca nel diario</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Digita per filtrare..." #input>
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>
            </div>

            <button mat-flat-button color="primary" class="btn-primary-custom" (click)="addDiario()">
                <fa-icon icon="plus"></fa-icon> Aggiungi
            </button>
        </div>

        <!-- Stato Vuoto -->
        <div *ngIf="!dataDiario || dataDiario.length === 0" class="empty-state">
            <mat-icon class="empty-icon">menu_book</mat-icon>
            <p>Nessun elemento presente</p>
        </div>

        <!-- Tabella Diario Educativo -->
        <div class="table-card-container" *ngIf="dataDiario && dataDiario.length > 0">
            <table mat-table [dataSource]="diarioEducativoDataSource" class="custom-table">

                <!-- Data Column -->
                <ng-container matColumnDef="data">
                    <th mat-header-cell *matHeaderCellDef class="col-date"> Data </th>
                    <td mat-cell *matCellDef="let element" class="col-date font-weight-medium">
                        {{element.data | date: 'dd/MM/yyyy'}}
                    </td>
                </ng-container>

                <!-- Contenuto Column -->
                <ng-container matColumnDef="contenuto">
                    <th mat-header-cell *matHeaderCellDef> Contenuto </th>
                    <td mat-cell *matCellDef="let element" class="text-content">
                        {{ element.contenuto }}
                    </td>
                </ng-container>

                <!-- Firma Column -->
                <ng-container matColumnDef="firma">
                    <th mat-header-cell *matHeaderCellDef class="col-firma"> Firma </th>
                    <td mat-cell *matCellDef="let element" class="col-firma text-muted">
                        {{element.firma}}
                    </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="text-end col-action"> Azioni </th>
                    <td mat-cell *matCellDef="let row" class="text-end col-action">
                        <button mat-icon-button color="primary" matTooltip="Modifica" (click)="editItem(row)">
                            <fa-icon icon="edit"></fa-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="DisplayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: DisplayedColumns;"></tr>
            </table>

            <!-- Paginatore -->
            <mat-paginator #paginatorDC
                           [pageSizeOptions]="[5, 10, 20]"
                           showFirstLastButtons
                           class="custom-paginator"
                           aria-label="Seleziona la pagina">
            </mat-paginator>
        </div>

    </div>
</div>
