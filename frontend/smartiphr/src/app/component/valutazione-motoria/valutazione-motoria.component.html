<div class="component-container">
    <div class="card-form">

        <!-- Titolo della Scheda -->
        <h3 class="card-title">Valutazione Motoria</h3>

        <!-- Campo Valutazione (Textarea) -->
        <div class="row mb-4">
            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Note e osservazioni sulla valutazione motoria</mat-label>
                    <textarea matInput
                              rows="6"
                              placeholder="Inserisci qui i dettagli della valutazione motoria..."
                              [disabled]="disable"
                              [(ngModel)]="data.valutazione">
          </textarea>
                </mat-form-field>
            </div>
        </div>

        <!-- Sezione Dimissioni -->
        <div class="section-divider">
            <h4 class="section-subtitle">Dimissioni</h4>
        </div>

        <div class="row">
            <!-- Dettagli Dimissione -->
            <div class="col-md-6 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Note Dimissioni</mat-label>
                    <input matInput
                           placeholder="Inserisci note relative alle dimissioni..."
                           [disabled]="disable"
                           [(ngModel)]="data.dimissione">
                </mat-form-field>
            </div>

            <!-- Data Dimissione -->
            <div class="col-md-6 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Data Dimissione</mat-label>
                    <input matInput
                           [matDatepicker]="pickerDimissione"
                           placeholder="GG/MM/AAAA"
                           [disabled]="disable"
                           [(ngModel)]="data.dimissioneDate">
                    <mat-datepicker-toggle matSuffix [for]="pickerDimissione"></mat-datepicker-toggle>
                    <mat-datepicker #pickerDimissione></mat-datepicker>
                </mat-form-field>
            </div>
        </div>

    </div>
</div>
