<div mat-dialog-title class="d-flex align-items-center justify-content-between pb-2 mb-3 border-bottom">
    <h2 class="m-0 text-primary fs-5 fw-bold d-flex align-items-center gap-2">
        <mat-icon>add_shopping_cart</mat-icon>
        Nuova Richiesta
    </h2>
    <button mat-icon-button mat-dialog-close title="Chiudi">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="pt-2">
    <div class="row g-3">
        <!-- Selezione Materiale -->
        <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Materiale</mat-label>
                <mat-select [(ngModel)]="richiesta.materiale" required>
                    <mat-option value="" disabled>Seleziona un materiale...</mat-option>
                    <mat-option *ngFor="let option of materiali" [value]="option.Title">
                        {{option.Title}}
                    </mat-option>
                </mat-select>
                <mat-icon matSuffix>inventory_2</mat-icon>
            </mat-form-field>
        </div>

        <!-- Campo Quantità -->
        <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Quantità</mat-label>
                <input matInput type="number" placeholder="Inserisci la quantità" [(ngModel)]="richiesta.quantita" min="1" required>
                <mat-icon matSuffix>format_list_numbered</mat-icon>
            </mat-form-field>
        </div>

        <!-- Campo Note -->
        <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Note</mat-label>
                <textarea matInput rows="3" [(ngModel)]="richiesta.note" placeholder="Inserisci eventuali note o dettagli..."></textarea>
                <mat-icon matSuffix>note</mat-icon>
            </mat-form-field>
        </div>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="d-flex justify-content-end gap-2 pt-3 border-top mt-3">
    <button mat-button mat-dialog-close>
        Annulla
    </button>
    <button mat-raised-button color="primary" [mat-dialog-close]="true" (click)="salva()" [disabled]="!richiesta.materiale || !richiesta.quantita">
        <mat-icon>save</mat-icon>
        <span class="ms-1">Salva</span>
    </button>
</div>
