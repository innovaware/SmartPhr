
<div class="dialog-header">
    <div class="row">
        <div class="col">
            <h4 *ngIf="!data.altro"><b>CARTELLA CLINICA</b></h4>
            <h4 *ngIf="data.altro"><b>ALTRO</b></h4>
        </div>
        <div class="col-1">
            <button mat-raised-button color="primary" (click)="salva()" title="Salva">
                <mat-icon>save</mat-icon>
            </button>
        </div>
        <div class="col-1">
            <button mat-button [mat-dialog-close]="true" title="Chiudi">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
</div>

<mat-dialog-content>
    <div class="container-fluid">
        <div class="row">
            <div class="col">

                <mat-tab-group mat-align-tabs="start">
                    <mat-tab label="Generale" *ngIf="!data.altro">
                        <!-- <app-paziente-generale [disable]=true [(data)]=cartella></app-paziente-generale> -->
                        <app-paziente-generale [data]=data.paziente [disable]=true></app-paziente-generale>
                    </mat-tab>

                    <mat-tab label="Anamnesi Patologica" *ngIf="!data.altro">
                        <app-anamnesi-patologica [data]=schedaAnamnesiPatologica></app-anamnesi-patologica>
                    </mat-tab>

                    <mat-tab label="Anamnesi Famigliare" *ngIf="!data.altro">
                        <app-anamnesi-famigliare [data]=schedaAnamnesiFamigliare></app-anamnesi-famigliare>
                    </mat-tab>



                    <mat-tab label="Esame Generale" *ngIf="!data.altro">
                        <app-esame-generale [data]=schedaEsameGenerale></app-esame-generale>
                    </mat-tab>

                    <mat-tab label="Esame Neurologica" *ngIf="!data.altro">
                        <app-esame-neurologica [data]=schedaEsameNeurologia></app-esame-neurologica>
                    </mat-tab>

                    <mat-tab label="Mezzi di Contenzione" *ngIf="!data.altro">
                        <app-mezzi-contenzione [data]=schedaMezziContenzione></app-mezzi-contenzione>
                    </mat-tab>

                    <mat-tab label="Valutazione Tecniche" *ngIf="!data.altro">
                        <app-valutazione-tecniche [data]=data.paziente></app-valutazione-tecniche>
                    </mat-tab>

                    <mat-tab label="Visite specialistiche/Esami paraclinici" *ngIf="!data.altro">
                        <app-visite-specialistiche [data]=data.paziente></app-visite-specialistiche>
                    </mat-tab>

                    <mat-tab label="Diario" *ngIf="!data.altro">
                        <app-diario-clinico [data]=data.paziente>></app-diario-clinico>
                    </mat-tab>




                </mat-tab-group>

            </div>
        </div>
    </div>
</mat-dialog-content>
