<!-- Intestazione della Dialog -->
<div class="dialog-header">
    <h2 class="dialog-title">CARTELLA EDUCATIVA</h2>
    <div class="header-actions">
        <button type="button" class="btn-save" (click)="salva()" aria-label="Salva" title="Salva">
            <mat-icon>save</mat-icon>
        </button>
        <button type="button" class="btn-close" [mat-dialog-close]="true" aria-label="Chiudi">
            &times;
        </button>
    </div>
</div>

<mat-dialog-content class="dialog-content-container">
    <mat-tab-group mat-align-tabs="start" class="custom-tab-group">

        <!-- GENERALE -->
        <mat-tab label="Generale">
            <div class="tab-content-inner">
                <app-paziente-generale [data]="data.paziente" [disable]="true"></app-paziente-generale>
            </div>
        </mat-tab>

        <!-- SOCIALIZZAZIONE -->
        <mat-tab label="Socializzazione">
            <div class="tab-content-inner">
                <app-socializzazione-educativa [data]="socializzazione"></app-socializzazione-educativa>
            </div>
        </mat-tab>

        <!-- ADL -->
        <mat-tab label="ADL (Activities of Daily Living)">
            <div class="tab-content-inner">
                <app-scheda-adl [data]="ADL"></app-scheda-adl>
            </div>
        </mat-tab>

        <!-- IADL -->
        <mat-tab label="IADL (Attività Strumentali)">
            <div class="tab-content-inner">
                <app-scheda-iadl [data]="IADL"></app-scheda-iadl>
            </div>
        </mat-tab>

        <!-- VALUTAZIONE EDUCATIVA -->
        <mat-tab label="Valutazione Educativa">
            <div class="tab-content-inner">
                <app-valutazione-educativa [data]="valutazioneEducativa"></app-valutazione-educativa>
            </div>
        </mat-tab>

        <!-- DIARIO EDUCATIVO -->
        <mat-tab label="Diario Educativo">
            <div class="tab-content-inner">
                <app-diario-educativo [data]="data.paziente"></app-diario-educativo>
            </div>
        </mat-tab>

    </mat-tab-group>
</mat-dialog-content>
