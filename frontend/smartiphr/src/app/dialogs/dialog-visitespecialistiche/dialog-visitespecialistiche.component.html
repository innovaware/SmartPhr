<!-- HEADER DIALOG -->
<div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom bg-light">
    <h4 class="m-0 fw-bold text-primary">VISITE SPECIALISTICHE</h4>
    <div class="d-flex align-items-center gap-2">
        <button mat-raised-button
                color="primary"
                (click)="salva()"
                [disabled]="data.readonly"
                title="Salva">
            <mat-icon class="me-1">save</mat-icon>
            <span>Salva</span>
        </button>
        <!-- RIMOSSO [mat-dialog-close]="true" -->
        <button mat-icon-button [mat-dialog-close]="true" title="Chiudi">
            <mat-icon>close</mat-icon>
        </button>
    </div>
</div>
<!-- CONTENUTO DIALOG -->
<mat-dialog-content>
    <div class="p-4">

        <!-- CARD SEZIONE DATE -->
        <mat-card appearance="outlined" class="rounded-3 p-3 mb-4">
            <mat-card-header class="px-0 pt-0 pb-2">
                <mat-card-title class="fs-6 fw-semibold text-secondary">Date della Visita</mat-card-title>
            </mat-card-header>
            <mat-card-content class="px-0 pb-0">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Data richiesta</mat-label>
                            <input matInput
                                   [matDatepicker]="pickerReq"
                                   [(ngModel)]="data.visitaSpecialistica.dataReq"
                                   [disabled]="data.readonly"
                                   readonly
                                   (click)="!data.readonly && pickerReq.open()" />
                            <mat-datepicker-toggle matSuffix [for]="pickerReq"></mat-datepicker-toggle>
                            <mat-datepicker #pickerReq></mat-datepicker>
                        </mat-form-field>
                    </div>

                    <div class="col-12 col-md-6">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Data esecuzione</mat-label>
                            <input matInput
                                   [matDatepicker]="pickerEsec"
                                   [(ngModel)]="data.visitaSpecialistica.dataEsec"
                                   [disabled]="data.readonly"
                                   readonly
                                   (click)="!data.readonly && pickerEsec.open()" />
                            <mat-datepicker-toggle matSuffix [for]="pickerEsec"></mat-datepicker-toggle>
                            <mat-datepicker #pickerEsec></mat-datepicker>
                        </mat-form-field>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>

        <!-- CARD SEZIONE CONTENUTO -->
        <mat-card appearance="outlined" class="rounded-3 p-3">
            <mat-card-header class="px-0 pt-0 pb-2">
                <mat-card-title class="fs-6 fw-semibold text-secondary">Contenuto della Visita</mat-card-title>
            </mat-card-header>
            <mat-card-content class="px-0 pb-0">
                <mat-form-field appearance="outline" class="w-100">
                    <textarea matInput
                              placeholder="Inserisci il contenuto della visita specialistica..."
                              rows="4"
                              [(ngModel)]="data.visitaSpecialistica.contenuto"
                              [disabled]="data.readonly">
                    </textarea>
                </mat-form-field>
            </mat-card-content>
        </mat-card>

    </div>
</mat-dialog-content>
