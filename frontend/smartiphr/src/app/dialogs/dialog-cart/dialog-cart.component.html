<div class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <h2 mat-dialog-title class="m-0 d-flex align-items-center">
        <mat-icon class="me-2">shopping_bag</mat-icon>
        Carrello: {{title}}
    </h2>
    <button mat-icon-button mat-dialog-close aria-label="Chiudi">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="pt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="status-indicator">
            Stato attuale:
            <strong [class]="uso ? 'text-danger' : 'text-success'">
                {{uso ? 'In Uso' : 'Disponibile'}}
            </strong>
        </div>

        <button mat-flat-button color="primary" (click)="add()">
            <mat-icon>add</mat-icon> Aggiungi Elemento
        </button>
    </div>

    <div class="table-responsive mat-elevation-z1 rounded">
        <table mat-table [dataSource]="dataSource" class="full-width-table text-center">

            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Elemento </th>
                <td mat-cell *matCellDef="let element" class="text-center"> {{element.elementoName}} </td>
            </ng-container>

            <ng-container matColumnDef="tipo">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Tipologia </th>
                <td mat-cell *matCellDef="let element" class="text-center"> {{element.elementoType}} </td>
            </ng-container>

            <ng-container matColumnDef="quantita">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Quantità </th>
                <td mat-cell *matCellDef="let element" class="text-center font-weight-bold"> {{element.quantita}} </td>
            </ng-container>

            <ng-container matColumnDef="paziente">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Ospite </th>
                <td mat-cell *matCellDef="let element" class="text-center"> {{element.pazienteNome ? element.pazienteNome : '-'}} </td>
            </ng-container>

            <ng-container matColumnDef="note">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Note </th>
                <td mat-cell *matCellDef="let element" class="text-center text-muted"> {{element.note ? element.note : '-'}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Azioni </th>
                <td mat-cell *matCellDef="let row" class="text-center">
                    <div class="d-flex justify-content-center gap-1">
                        <ng-container *ngIf="data.carrello.type === 'Infermieri'">
                            <button mat-icon-button color="primary" matTooltip="Somministra" (click)="somministra(row)">
                                <mat-icon>vaccines</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Scarta" (click)="scarto(row)">
                                <mat-icon>delete_outline</mat-icon>
                            </button>
                        </ng-container>

                        <button mat-icon-button color="accent" matTooltip="Modifica" (click)="edit(row)">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator #Contenuto [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="p-3 border-top gap-2">
    <button mat-stroked-button [color]="uso ? 'warn' : 'accent'" (click)="toggleUso()">
        <mat-icon>{{uso ? 'lock_open' : 'lock'}}</mat-icon>
        {{uso ? 'Rilascia / Libera' : 'Prendi In Uso'}}
    </button>
    <button mat-flat-button color="primary" (click)="save()">
        <mat-icon>save</mat-icon> Salva Modifiche
    </button>
    <button mat-button mat-dialog-close>Chiudi</button>
</mat-dialog-actions>
