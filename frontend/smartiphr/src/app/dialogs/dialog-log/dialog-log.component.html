<!-- Intestazione Dialog -->
<div mat-dialog-title class="d-flex align-items-center justify-content-between pb-2 mb-3 border-bottom">
    <h2 class="m-0 text-primary fs-5 fw-bold d-flex align-items-center gap-2">
        <mat-icon class="flex-shrink-0">receipt_long</mat-icon>
        <span>Logs del {{data.data | date: 'dd/MM/yyyy'}}</span>
    </h2>
    <button mat-icon-button mat-dialog-close title="Chiudi">
        <mat-icon>close</mat-icon>
    </button>
</div>

<!-- Contenuto Dialog -->
<mat-dialog-content class="p-0 overflow-hidden">
    <div class="container-fluid p-3">

        <!-- Campo Ricerca -->
        <div class="row mb-3">
            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100 compact-form-field">
                    <mat-label>Cerca nei log</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Cerca per operatore, classe, operazione..." [(ngModel)]="inputSearchField">
                    <button mat-icon-button matSuffix *ngIf="inputSearchField" (click)="cleanSearchField()" title="Pulisci ricerca">
                        <mat-icon>clear</mat-icon>
                    </button>
                    <mat-icon matSuffix *ngIf="!inputSearchField">search</mat-icon>
                </mat-form-field>
            </div>
        </div>

        <!-- Blocco Tabella + Paginatore -->
        <div class="row">
            <div class="col-12">
                <div class="mat-elevation-z8 rounded-2 overflow-hidden">

                    <table mat-table [dataSource]="dataSource" class="log-table">

                        <!-- Data & Ora -->
                        <ng-container matColumnDef="data">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase col-data"> Data & Ora </th>
                            <td mat-cell *matCellDef="let element" class="col-data">
                                <div class="d-flex align-items-center gap-2 text-nowrap">
                                    <mat-icon class="text-muted icon-sm flex-shrink-0">schedule</mat-icon>
                                    <span>{{element.data | date: 'dd/MM/yyyy HH:mm'}}</span>
                                </div>
                            </td>
                        </ng-container>

                        <!-- Operatore -->
                        <ng-container matColumnDef="operatore">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase col-operatore"> Operatore </th>
                            <td mat-cell *matCellDef="let element" class="col-operatore">
                                <div class="d-flex align-items-center gap-2">
                                    <mat-icon class="text-secondary icon-sm flex-shrink-0">person</mat-icon>
                                    <span class="fw-semibold text-break">{{element.operatore || '-'}}</span>
                                </div>
                            </td>
                        </ng-container>

                        <!-- Class Name -->
                        <ng-container matColumnDef="className">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase col-classname"> Class Name </th>
                            <td mat-cell *matCellDef="let element" class="col-classname">
                                <code class="text-dark bg-light px-2 py-1 rounded fs-7 d-block text-break">{{element.className || '-'}}</code>
                            </td>
                        </ng-container>

                        <!-- Operazione -->
                        <ng-container matColumnDef="operazione">
                            <th mat-header-cell *matHeaderCellDef class="fw-bold text-uppercase col-operazione"> Operazione </th>
                            <td mat-cell *matCellDef="let element" class="col-operazione">
                                <div class="text-break py-1">
                                    {{element.operazione || '-'}}
                                </div>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row-hover"></tr>
                    </table>

                    <!-- Paginatore visibile e integrato nella card -->
                    <mat-paginator #paginator [pageSize]="5" [pageSizeOptions]="[5, 10]" showFirstLastButtons class="border-top" aria-label="Seleziona pagina">
                    </mat-paginator>

                </div>
            </div>
        </div>

    </div>
</mat-dialog-content>
