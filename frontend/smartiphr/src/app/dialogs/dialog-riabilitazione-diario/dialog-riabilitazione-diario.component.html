<!-- Intestazione Modal con pulsante Salva (Floppy) in alto -->
<div class="dialog-header">
    <h2 class="dialog-title">DIARIO RIABILITATIVO</h2>
    <div class="header-actions">
        <button type="button" class="btn-save" (click)="save()" aria-label="Salva" title="Salva">
            <mat-icon>save</mat-icon>
            <span>Salva</span>
        </button>
        <button type="button" class="btn-close" [mat-dialog-close]="undefined" aria-label="Chiudi" title="Chiudi">
            &times;
        </button>
    </div>
</div>

<!-- Contenuto della Dialog -->
<mat-dialog-content class="dialog-content-container">
    <div class="card-form">

        <!-- Data -->
        <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Data </mat-label>
                <input matInput [matDatepicker]="pickerData" placeholder="GG/MM/AAAA" [(ngModel)]="diario.data" required>
                <mat-datepicker-toggle matSuffix [for]="pickerData"></mat-datepicker-toggle>
                <mat-datepicker #pickerData></mat-datepicker>
            </mat-form-field>
        </div>

        <!-- Controllo (Radio Button Stilizzati) -->
        <div class="mb-4">
            <label class="form-label-custom">Controllo (Fisioterapista) *</label>
            <mat-radio-group class="custom-radio-group" aria-label="Seleziona tipo di controllo" [(ngModel)]="diario.controllo">
                <mat-radio-button value="1" class="radio-up">
                    <span class="radio-label-content">&#x25B2; Miglioramento</span>
                </mat-radio-button>
                <mat-radio-button value="2" class="radio-stable">
                    <span class="radio-label-content">&#x25FC; Stabile</span>
                </mat-radio-button>
                <mat-radio-button value="3" class="radio-down">
                    <span class="radio-label-content">&#x25BC; Peggioramento</span>
                </mat-radio-button>
            </mat-radio-group>
        </div>

        <!-- Note / Contenuto -->
        <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Note </mat-label>
                <textarea matInput rows="4" placeholder="Inserisci il contenuto delle note..." [(ngModel)]="diario.note" required></textarea>
            </mat-form-field>
        </div>

        <!-- Firma -->
        <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Firma </mat-label>
                <input matInput placeholder="Inserisci la firma dell'operatore" [(ngModel)]="diario.firma" required>
            </mat-form-field>
        </div>

        <div class="required-info">
            <mat-icon class="info-icon">info</mat-icon>
            <span>I campi contrassegnati con l'asterisco (<span class="required-asterisk">*</span>) sono obbligatori.</span>
        </div>

    </div>
</mat-dialog-content>
