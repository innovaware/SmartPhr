<div class="dialog-header p-3 border-bottom">
    <div class="row align-items-center">
        <div class="col">
            <h4 class="m-0 fw-bold text-uppercase" style="color: #1976d2;">
                {{data.isNew ? 'Nuovo Materiale o Presidio' : 'Materiale o Presidio'}}
            </h4>
        </div>
        <div class="col-auto d-flex align-items-center gap-3">
            <div class="text-end text-muted fs-6" *ngIf="magazzino?.dateInsert">
                <span class="fw-bold">Data di Riferimento:</span>
                {{magazzino.dateInsert | date: 'dd/MM/yyyy'}}
            </div>
            <button mat-icon-button (click)="cancel()" title="Chiudi">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
</div>

<mat-dialog-content class="pt-4">
    <div class="container-fluid p-0">
        <div class="row g-3">

            <!-- Nome -->
            <div class="col-md-6 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Nome Materiale / Presidio</mat-label>
                    <input matInput placeholder="Inserisci Nome" [(ngModel)]="magazzino.nome">
                    <mat-icon matSuffix>inventory_2</mat-icon>
                </mat-form-field>
            </div>

            <!-- Area -->
            <div class="col-md-6 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Area</mat-label>
                    <input matInput placeholder="Inserisci Area" [(ngModel)]="magazzino.area">
                    <mat-icon matSuffix>place</mat-icon>
                </mat-form-field>
            </div>

            <!-- Descrizione -->
            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Descrizione</mat-label>
                    <textarea matInput rows="3" placeholder="Inserisci descrizione del materiale" [(ngModel)]="magazzino.descrizione"></textarea>
                </mat-form-field>
            </div>

            <!-- Quantità -->
            <div class="col-md-4 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Quantità</mat-label>
                    <input matInput type="number" placeholder="Inserisci quantità" [(ngModel)]="magazzino.quantita">
                    <mat-icon matSuffix>format_list_numbered</mat-icon>
                </mat-form-field>
            </div>

            <!-- Giacenza -->
            <div class="col-md-4 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Giacenza</mat-label>
                    <input matInput type="number" placeholder="Inserisci giacenza" [(ngModel)]="magazzino.giacenza">
                    <mat-icon matSuffix>warehouse</mat-icon>
                </mat-form-field>
            </div>

            <!-- Conformi -->
            <div class="col-md-4 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Conformi</mat-label>
                    <input matInput type="number" placeholder="Inserisci conformi" [(ngModel)]="magazzino.conformi">
                    <mat-icon matSuffix>verified</mat-icon>
                </mat-form-field>
            </div>

            <!-- In Uso -->
            <div class="col-12 mt-2">
                <mat-checkbox color="primary" class="fw-bold" [(ngModel)]="magazzino.inuso">
                    In Uso
                </mat-checkbox>
            </div>

        </div>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="d-flex justify-content-end gap-2 p-3 border-top m-0">
    <button mat-button (click)="cancel()">Annulla</button>
    <button mat-raised-button color="primary" (click)="save()">
        <mat-icon>save</mat-icon>
        <span class="ms-1">Salva</span>
    </button>
</div>
