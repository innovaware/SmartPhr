<div mat-dialog-title class="dialog-header">
    <div class="d-flex align-items-center justify-content-between">
        <h3 class="m-0 font-weight-bold text-primary">DIARIO</h3>
        <button mat-icon-button [mat-dialog-close]="true" aria-label="Chiudi">
            <mat-icon>close</mat-icon>
        </button>
    </div>
</div>

<mat-dialog-content class="dialog-content">
    <div class="form-group mb-3">
        <label for="contenutoDiario" class="form-label font-weight-bold text-secondary">
            CONTENUTO <span class="text-danger">*</span>
        </label>
        <textarea id="contenutoDiario"
                  class="form-control custom-textarea"
                  rows="6"
                  placeholder="Inserisci qui il testo del diario..."
                  [(ngModel)]="item.contenuto"
                  required>
    </textarea>
    </div>

    <div class="required-note">
        <small class="text-muted">
            <span class="text-danger">*</span> Tutti i campi indicati con l'asterisco sono obbligatori.
        </small>
    </div>
</mat-dialog-content>

<div mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button class="btn-cancel" [mat-dialog-close]="true">Annulla</button>
    <button mat-raised-button color="primary" class="btn-save" (click)="salva()" [disabled]="!item.contenuto">
        Salva
    </button>
</div>
