<!-- Header Dialog Personalizzato -->
<div class="dialog-header">
    <div class="dialog-title-container">
        <h2 class="dialog-title">Dati Segnalazione</h2>
    </div>
    <div class="dialog-header-actions">
        <button mat-flat-button class="btn-save-custom me-2" [mat-dialog-close]="true" (click)="salva()">
            <mat-icon class="me-1">save</mat-icon>
            Salva
        </button>
        <button type="button" class="close-button" [mat-dialog-close]="true" aria-label="Chiudi">&times;</button>
    </div>
</div>

<!-- Contenuto Dialog Form -->
<mat-dialog-content class="dialog-content-custom">
    <div class="container-fluid p-0">
        <div class="row">
            <!-- Numero Ticket -->
            <div class="col-12 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Ticket n°</mat-label>
                    <input matInput type="number" placeholder="Numero Ticket" [value]="ticket" disabled>
                </mat-form-field>
            </div>

            <!-- Descrizione -->
            <div class="col-12 mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Descrizione</mat-label>
                    <textarea matInput rows="4" [(ngModel)]="descrizione" placeholder="Inserisci qui la descrizione della segnalazione..."></textarea>
                </mat-form-field>
            </div>
        </div>
    </div>
</mat-dialog-content>
