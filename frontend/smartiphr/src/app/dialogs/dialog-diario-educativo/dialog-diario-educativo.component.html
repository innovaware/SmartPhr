<!-- Header Modal / Dialog con salvataggio in alto -->
<div class="dialog-header">
    <h2 class="dialog-title">Diario Educativo</h2>
    <div class="header-actions">
        <button type="button" class="btn-save" (click)="salva()" aria-label="Salva" title="Salva">
            <mat-icon>save</mat-icon>
            <span>Salva</span>
        </button>
        <button type="button" class="btn-close" [mat-dialog-close]="true" aria-label="Chiudi" title="Chiudi">
            &times;
        </button>
    </div>
</div>

<!-- Contenuto Dialog -->
<mat-dialog-content class="dialog-content-container">
    <div class="card-form">
        <h4 class="card-title">Inserisci Contenuto <span class="required-asterisk">*</span></h4>

        <mat-form-field appearance="outline" class="w-100">
            <mat-label>Contenuto della nota</mat-label>
            <textarea matInput
                      rows="6"
                      placeholder="Scrivi qui le annotazioni del diario..."
                      [(ngModel)]="item.contenuto"
                      required>
      </textarea>
        </mat-form-field>

        <div class="required-info">
            <mat-icon class="info-icon">info</mat-icon>
            <span>I campi contrassegnati con l'asterisco (<span class="required-asterisk">*</span>) sono obbligatori.</span>
        </div>
    </div>
</mat-dialog-content>
