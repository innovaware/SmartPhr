<div mat-dialog-title class="d-flex align-items-center justify-content-between border-bottom pb-3 px-4 px-md-5 pt-4 mb-0">
    <h2 class="m-0 font-weight-bold text-primary fs-4">INTERVENTI</h2>

    <div class="d-flex align-items-center gap-2">
        <button mat-flat-button color="primary" (click)="save()" title="Salva">
            <mat-icon class="me-1">save</mat-icon>
            Salva
        </button>

        <button mat-icon-button [mat-dialog-close]="true" title="Chiudi">
            <mat-icon>close</mat-icon>
        </button>
    </div>
</div>

<mat-dialog-content class="px-4 px-md-5 py-4">
    <!-- Contenitore a larghezza controllata e centrato -->
    <div class="mx-auto" style="max-width: 720px;">

        <form class="d-flex flex-column gap-4">

            <!-- DATA -->
            <div>
                <label class="form-label font-weight-bold text-uppercase text-secondary mb-2">
                    Data <span class="text-danger">*</span>
                </label>
                <mat-form-field appearance="outline" class="w-100">
                    <input matInput
                           [matDatepicker]="pickerData"
                           [(ngModel)]="item.data"
                           name="data"
                           [disabled]="disable"
                           placeholder="Scegli una data"
                           required>
                    <mat-datepicker-toggle matSuffix [for]="pickerData"></mat-datepicker-toggle>
                    <mat-datepicker #pickerData></mat-datepicker>
                </mat-form-field>
            </div>

            <!-- DIAGNOSI -->
            <div>
                <label class="form-label font-weight-bold text-uppercase text-secondary mb-2">
                    Diagnosi <span class="text-danger">*</span>
                </label>
                <mat-form-field appearance="outline" class="w-100">
                    <textarea matInput
                              cdkTextareaAutosize
                              [cdkAutosizeMinRows]="3"
                              placeholder="Inserisci la diagnosi..."
                              [(ngModel)]="item.diagnosi"
                              name="diagnosi"
                              [disabled]="disable"
                              required>
                    </textarea>
                </mat-form-field>
            </div>

            <!-- INTERVENTO -->
            <div>
                <label class="form-label font-weight-bold text-uppercase text-secondary mb-2">
                    Intervento <span class="text-danger">*</span>
                </label>
                <mat-form-field appearance="outline" class="w-100">
                    <textarea matInput
                              cdkTextareaAutosize
                              [cdkAutosizeMinRows]="3"
                              placeholder="Inserisci l'intervento..."
                              [(ngModel)]="item.intervento"
                              name="intervento"
                              required>
                    </textarea>
                </mat-form-field>
            </div>

            <!-- FIRMA -->
            <div>
                <label class="form-label font-weight-bold text-uppercase text-secondary mb-2">
                    Firma
                </label>
                <mat-form-field appearance="outline" class="w-100">
                    <textarea matInput
                              cdkTextareaAutosize
                              [cdkAutosizeMinRows]="2"
                              placeholder="Inserisci la firma..."
                              [(ngModel)]="item.firma"
                              name="firma"
                              [disabled]="disable">
                    </textarea>
                </mat-form-field>
            </div>

            <!-- Avviso campi obbligatori -->
            <p class="text-muted text-center small mb-0 mt-1">
                I campi indicati con <span class="text-danger font-weight-bold">*</span> sono obbligatori.
            </p>

        </form>

    </div>
</mat-dialog-content>
